name: Build GhostLock APK (Redmi 15 - IMEI Locked)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/vivo-t4x-device-support-kki9qn

env:
  ONDK_VERSION: "r30.1"

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ghostlock-build/tools/extract_rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('ghostlock-build/tools/extract_rs/Cargo.lock') }}

      - name: Cache ONDK
        id: ondk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ondk
          key: ondk-${{ env.ONDK_VERSION }}-linux

      - name: Download ONDK
        if: steps.ondk-cache.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/topjohnwu/ondk/releases/download/${ONDK_VERSION}/ondk-${ONDK_VERSION}-linux.tar.xz"
          mkdir -p "${{ runner.temp }}/ondk"
          curl -fL "$url" -o "${{ runner.temp }}/ondk.tar.xz"
          tar -C "${{ runner.temp }}/ondk" --strip-components=1 -xf "${{ runner.temp }}/ondk.tar.xz"

      - name: Link ONDK Rust toolchain
        run: rustup toolchain link ondk "${{ runner.temp }}/ondk/toolchains/rust"

      - name: Build Ghostlock native binary
        working-directory: ghostlock-build
        run: |
          export ANDROID_NDK_HOME="${{ runner.temp }}/ondk"
          export NDK_ROOT="$ANDROID_NDK_HOME"
          make ghostlock

      - name: Build extractor for Android
        working-directory: ghostlock-build/tools/extract_rs
        run: |
          export CC_aarch64_linux_android="${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          export AR_aarch64_linux_android="${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export RUSTC_BOOTSTRAP=1
          export RUSTFLAGS="-C force-unwind-tables=no -C link-arg=-Wl,--icf=all"
          cargo +ondk build --release --target aarch64-linux-android \
            -Z build-std=std,panic_abort -Z build-std-features=optimize_for_size

      - name: Build Release APK
        working-directory: ghostlock-build
        run: |
          export ONDK_HOME="${{ runner.temp }}/ondk"
          export ANDROID_NDK_HOME="$ONDK_HOME"
          export NDK_ROOT="$ONDK_HOME"
          ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          find ghostlock-build/app/build/outputs/apk -name "*.apk" | head -1 | xargs -I{} cp {} GhostLock-Redmi15-IMEI-Locked.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostLock-Redmi15
          path: GhostLock-Redmi15-IMEI-Locked.apk
